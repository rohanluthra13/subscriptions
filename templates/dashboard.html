<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Subscription Manager</title>
    <style>
        body { margin: 0; font-family: "SF Mono", monospace; background: white; }
        
        /* Main layout: 1/3 left, 2/3 right */
        .container { display: grid; grid-template-columns: 1fr 2fr; height: 100vh; }
        
        /* Left panel with 4 sections */
        .left-panel { border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        
        /* Each section has fixed height */
        .section { 
            border-bottom: 1px solid #e0e0e0;
        }
        .section:nth-child(1) { 
            height: 10vh; 
            display: flex;
            align-items: end;
            padding-bottom: 20px;
        }
        .section:nth-child(2), 
        .section:nth-child(3), 
        .section:nth-child(4) { 
            display: grid; 
            grid-template-columns: 1fr 2fr;
            align-items: end;
            padding-bottom: 20px;
        }
        .section:nth-child(2) { height: 25vh; }
        .section:nth-child(3) { height: 25vh; }
        .section:nth-child(4) { height: 25vh; }
        
        /* Left side of each section (title) */
        .section-title { 
            padding-left: 30px;
            font-size: 24px; 
            font-weight: 700; 
            color: #000;
        }
        
        /* Clickable section titles */
        a.section-title-link {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        
        a.section-title-link:hover {
            opacity: 0.7;
        }
        
        /* Right side of each section (content/actions) */
        .section-content { 
            padding-right: 30px;
            text-align: right;
        }
        
        /* Right panel for subscriptions */
        .right-panel { padding: 70px 30px 30px 30px; }
        .right-panel h2 { margin: 0 0 30px 0; font-size: 28px; font-weight: 700; }
        
        /* Table styling */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #e0e0e0; word-wrap: break-word; }
        th { font-weight: 600; font-size: 14px; color: #666; }
        td { font-size: 12px; }
        
        /* Button styling */
        button { 
            padding: 10px 20px; 
            margin-left: 10px;
            border: 1px solid #ddd; 
            background: white; 
            cursor: pointer; 
            font-size: 14px;
        }
        button:hover { background: #f8f9fa; }
        .primary { background: #007bff; color: white; border-color: #007bff; }
        .primary:hover { background: #0056b3; }
        
        /* Status text */
        .status { color: #666; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="section">
                <a href="/" class="section-title-link">
                    <div class="section-title">subscriptions</div>
                </a>
            </div>
            
            <div class="section">
                <a href="/?view=emails" class="section-title-link">
                    <div class="section-title">email connection</div>
                </a>
                <div class="section-content" style="{{connection_style}}">
                    {{connection_content}}
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">user info</div>
                <div class="section-content" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                    <!-- Empty for now - will be user information -->
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">LLM notes</div>
                <div class="section-content" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                    <!-- Empty for now - will be scratchpad/checkpoint -->
                </div>
            </div>
        </div>
        
        <div class="right-panel">
            {{right_panel_content}}
        </div>
    </div>
</body>
</html>
