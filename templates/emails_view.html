<div style="margin-bottom: 20px;">
    <a href="/" style="text-decoration: none;">
        <button style="border: none; background: none; color: #666; cursor: pointer; padding: 0; font-size: 14px; font-family: 'SF Mono', monospace;">back</button>
    </a>
</div>

<div style="margin-bottom: 20px; padding: 15px;">
    <form method="get" action="/" style="display: flex; gap: 15px; align-items: center;">
        <input type="hidden" name="view" value="emails">
        
        <div>
            <label style="font-size: 12px; color: #666; margin-right: 5px;">domain:</label>
            <select name="domain" style="padding: 5px; font-size: 12px; font-family: 'SF Mono', monospace;">
                {{domain_options}}
            </select>
        </div>
        
        <div>
            <label style="font-size: 12px; color: #666; margin-right: 5px;">has content:</label>
            <select name="has_content" style="padding: 5px; font-size: 12px; font-family: 'SF Mono', monospace;">
                <option value="">all</option>
                <option value="true" {{has_content_true_selected}}>with content</option>
                <option value="false" {{has_content_false_selected}}>metadata only</option>
            </select>
        </div>
        
        <button type="submit" style="border: none; background: none; color: #666; cursor: pointer; padding: 0; font-size: 12px; font-family: 'SF Mono', monospace;">apply filters</button>
        
        <a href="/?view=emails" style="text-decoration: none;">
            <button type="button" style="border: none; background: none; color: #666; cursor: pointer; padding: 0; font-size: 12px; font-family: 'SF Mono', monospace;">clear</button>
        </a>
    </form>
</div>

<div style="height: 65vh; overflow-y: auto;">
    <table style="font-size: 12px;">
    <thead style="position: sticky; top: 0; background: white;">
        <tr>
            <th style="width: 15%; padding: 8px;">{{domain_header}}</th>
            <th style="width: 25%; padding: 8px;">{{sender_header}}</th>
            <th style="width: 35%; padding: 8px;">{{subject_header}}</th>
            <th style="width: 10%; text-align: center; padding: 8px;">{{content_header}}</th>
            <th style="width: 15%; padding: 8px;">{{received_header}}</th>
        </tr>
    </thead>
    <tbody>
        {{email_rows}}
    </tbody>
    </table>
</div>

<!-- Pagination Controls -->
<div style="margin-top: 15px; text-align: center; padding: 10px; border-top: 1px solid #eee;">
    <div style="margin-bottom: 10px;">
        {{prev_link}}
        <span style="margin: 0 15px; font-size: 11px; color: #666;">page {{current_page}}-{{total_pages}}</span>
        {{next_link}}
    </div>
</div>

<div style="margin-top: 10px; font-size: 11px; color: #666;">
    Showing {{start_item}}-{{end_item}} of {{total}} emails. Content indicator: Y = has content, N = metadata only
</div>
