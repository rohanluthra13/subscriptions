<div class="manage-container">
    <!-- Add subscription button -->
    <div class="add-button-container">
        <button class="add-subscription-btn" id="add-btn">+</button>
    </div>
    
    <!-- Subscription cards -->
    <div class="cards-container" id="subscription-cards">
        {{subscription_cards}}
    </div>
</div>

<!-- Modal overlay for subscription form -->
<div class="modal-overlay" id="subscription-modal">
    <div class="modal-content">
        <div class="modal-header">
            <button class="modal-close" id="modal-close">&times;</button>
        </div>
        
        <form id="subscription-form" autocomplete="off">
            <input type="hidden" id="subscription-id" name="id">
            
            <div class="form-field">
                <label for="sub-name">name</label>
                <input type="text" id="sub-name" name="name" required autocomplete="off">
            </div>
            
            <div class="form-row">
                <div class="form-field cost-field">
                    <div class="cost-input-wrapper">
                        <input type="text" id="sub-cost" name="cost" autocomplete="off">
                        <span class="dollar-prefix">$</span>
                    </div>
                </div>
                
                <div class="form-field cycle-field">
                    <select id="sub-cycle" name="billing_cycle" class="form-control">
                        <option value="weekly">weekly</option>
                        <option value="monthly" selected>monthly</option>
                        <option value="annually">annually</option>
                    </select>
                </div>
                
                <div class="form-field currency-field">
                    <select id="sub-currency" name="currency" class="form-control">
                        <option value="NZD" selected>NZD</option>
                        <option value="USD">USD</option>
                        <option value="INR">INR</option>
                        <option value="GBP">GBP</option>
                        <option value="EUR">EUR</option>
                        <option value="AUD">AUD</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-field category-field">
                    <select id="sub-category" name="category" class="form-control">
                        <!-- Categories will be populated by server from database -->
                    </select>
                </div>
                <!-- Space for additional category field later -->
            </div>
            
            <div class="form-row">
                <div class="form-field status-field">
                    <select id="sub-status" name="status" class="form-control">
                        <option value="active" selected>active</option>
                        <option value="trial">trial</option>
                        <option value="paused">paused</option>
                        <option value="cancelled">cancelled</option>
                    </select>
                </div>
                <!-- Space for trial checkbox later -->
            </div>
            
            <div class="form-row">
                <div class="form-field renewing-field">
                    <div class="renewing-toggle">
                        <span class="toggle-label">renewing?</span>
                        <input type="hidden" id="sub-renewing" name="renewing" value="true">
                        <span class="toggle-icons">
                            <svg class="icon-option icon-check" data-value="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <svg class="icon-option icon-x" data-value="false" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>
            
            <div class="form-field">
                <label for="sub-website">website</label>
                <input type="url" id="sub-website" name="website_url" autocomplete="off">
            </div>
            
            <div class="form-field">
                <label for="sub-notes">notes</label>
                <textarea id="sub-notes" name="notes" rows="3" autocomplete="off"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" id="submit-btn">Add</button>
                <button type="button" id="delete-btn" class="delete-btn" style="display: none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"/>
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/>
                        <line x1="14" y1="11" x2="14" y2="17"/>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Confirmation modal for deletion -->
<div class="modal-overlay" id="delete-confirmation-modal">
    <div class="modal-content confirmation-content">
        <div class="confirmation-header">
            <h3 id="delete-confirmation-title">Delete Subscription</h3>
        </div>
        <div class="confirmation-body">
            <p id="delete-confirmation-message">Are you sure you want to delete this subscription?</p>
        </div>
        <div class="confirmation-actions">
            <button type="button" id="confirm-delete-btn" class="confirm-delete">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
                Delete
            </button>
            <button type="button" id="cancel-delete-btn">Cancel</button>
        </div>
    </div>
</div>

<script>
    // Cache DOM elements at module level to avoid repeated queries
    let modal;
    let deleteConfirmationModal;
    let form;
    let submitBtn;
    let confirmDeleteBtn;
    let cancelDeleteBtn;
    let deleteConfirmationMessage;
    
    // Form field caches
    let subscriptionIdField;
    let subNameField;
    let subCostField;
    let subCurrencyField;
    let subCycleField;
    let subCategoryField;
    let subStatusField;
    let subRenewingField;
    let subWebsiteField;
    let subNotesField;
    
    // Data will be fetched from server when needed - no client-side caching
    
    function initializeSubscriptionManager() {
        // Cache all DOM elements once to avoid repeated queries
        modal = document.getElementById('subscription-modal');
        deleteConfirmationModal = document.getElementById('delete-confirmation-modal');
        form = document.getElementById('subscription-form');
        submitBtn = document.getElementById('submit-btn');
        confirmDeleteBtn = document.getElementById('confirm-delete-btn');
        cancelDeleteBtn = document.getElementById('cancel-delete-btn');
        deleteConfirmationMessage = document.getElementById('delete-confirmation-message');
        
        // Cache form field elements
        subscriptionIdField = document.getElementById('subscription-id');
        subNameField = document.getElementById('sub-name');
        subCostField = document.getElementById('sub-cost');
        subCurrencyField = document.getElementById('sub-currency');
        subCycleField = document.getElementById('sub-cycle');
        subCategoryField = document.getElementById('sub-category');
        subStatusField = document.getElementById('sub-status');
        subRenewingField = document.getElementById('sub-renewing');
        subWebsiteField = document.getElementById('sub-website');
        subNotesField = document.getElementById('sub-notes');
        
        // Data is already available - no need to fetch
        
        
        // Initialize renewing toggle icons
        initializeRenewingToggle();
        
        // Use event delegation for add button
        document.addEventListener('click', (e) => {
            if (e.target.closest('#add-btn')) {
                openModal('add');
            }
        });

        // Use event delegation for card clicks
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.subscription-card');
            if (card) {
                const subscriptionId = card.dataset.subscriptionId;
                openModal('edit', subscriptionId);
            }
        });
        
        // Close modal handlers - use event delegation for modal-close button
        modal.addEventListener('click', (e) => {
            // Handle close button clicks (use ID selector for specificity)
            if (e.target.closest('#modal-close')) {
                closeModal();
                return;
            }
            // Handle clicks on modal overlay (outside modal content)
            if (e.target === modal) {
                closeModal();
            }
        });
        
        // Escape key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('visible')) {
                closeModal();
            }
        });
        
        // Form submission - use event delegation for dynamic forms
        modal.addEventListener('submit', (e) => {
            if (e.target.id === 'subscription-form') {
                handleFormSubmit(e);
            }
        });
        
        // Delete button click - use event delegation to handle dynamically replaced forms
        modal.addEventListener('click', (e) => {
            if (e.target.closest('#delete-btn')) {
                handleDeleteClick();
            }
        });
        
        // Delete confirmation handlers (using cached references)
        
        confirmDeleteBtn.addEventListener('click', handleConfirmDelete);
        cancelDeleteBtn.addEventListener('click', closeDeleteConfirmation);
        
        // Close confirmation modal when clicking outside
        deleteConfirmationModal.addEventListener('click', (e) => {
            if (e.target === deleteConfirmationModal) {
                closeDeleteConfirmation();
            }
        });
        
        // Escape key to close delete confirmation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && deleteConfirmationModal.classList.contains('visible')) {
                closeDeleteConfirmation();
            }
        });
    }
    

    function initializeFloatingLabels() {
        // Always re-initialize for new form content to attach listeners to new DOM elements
        
        const formFields = document.querySelectorAll('.form-field:not(.dropdown-field)');
        
        formFields.forEach(field => {
            const label = field.querySelector('label');
            if (!label) return;
            
            const input = field.querySelector('input[type="text"], input[type="url"], textarea');
            if (!input) return;
            
            // Handle label hiding on input (skip cost field - no label)
            if (input.id !== 'sub-cost') {
                input.addEventListener('input', () => {
                    updateLabelState(input, label);
                });
            }
            
            // No special handling needed for cost field anymore (no label)
        });
        
        updateFloatingLabelStates();
    }
    

    
    // Initialize renewing toggle functionality
    function initializeRenewingToggle() {
        // Use event delegation on modal for icon clicks
        modal.addEventListener('click', (e) => {
            const icon = e.target.closest('.icon-option');
            if (icon) {
                const value = icon.dataset.value;
                subRenewingField.value = value;
                updateRenewingIcons(value === 'true');
            }
        });
    }
    
    // Update visual state of renewing icons
    function updateRenewingIcons(isRenewing) {
        const checkIcon = document.querySelector('.icon-check');
        const xIcon = document.querySelector('.icon-x');
        
        if (checkIcon && xIcon) {
            if (isRenewing) {
                checkIcon.classList.add('active');
                xIcon.classList.remove('active');
            } else {
                checkIcon.classList.remove('active');
                xIcon.classList.add('active');
            }
        }
    }
    
    
    function updateLabelState(input, label) {
        if (input.value && input.value.trim()) {
            label.classList.add('hidden');
        } else {
            label.classList.remove('hidden');
        }
    }
    
    function updateFloatingLabelStates() {
        const formFields = document.querySelectorAll('.form-field:not(.dropdown-field)');
        
        formFields.forEach(field => {
            const label = field.querySelector('label');
            const input = field.querySelector('input[type="text"], input[type="url"], textarea');
            
            if (!input || !label) return;
            
            // Skip cost field (no label anymore)
            if (input.id === 'sub-cost') {
                return;
            }
            
            updateLabelState(input, label);
        });
    }
    
    
    async function openModal(mode, subscriptionId = null) {
        try {
            // Fetch form HTML from server
            let url;
            if (mode === 'add') {
                url = '/api/subscription/new';
            } else if (mode === 'edit' && subscriptionId) {
                url = `/api/subscription/${subscriptionId}/edit`;
            } else {
                console.error('Invalid modal mode or missing subscription ID');
                return;
            }

            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const formHtml = await response.text();

            // Replace the form content with server-rendered HTML
            const modalContent = document.querySelector('.modal-content');
            const modalHeader = modalContent.querySelector('.modal-header');

            // Keep the modal header, replace everything else
            modalContent.innerHTML = modalHeader.outerHTML + formHtml;

            // Re-cache form elements after DOM update
            form = document.getElementById('subscription-form');
            submitBtn = document.getElementById('submit-btn');
            deleteBtn = document.getElementById('delete-btn');

            // Re-cache form field elements for the new form
            subscriptionIdField = document.getElementById('subscription-id');
            subNameField = document.getElementById('sub-name');
            subCostField = document.getElementById('sub-cost');
            subCurrencyField = document.getElementById('sub-currency');
            subCycleField = document.getElementById('sub-cycle');
            subCategoryField = document.getElementById('sub-category');
            subStatusField = document.getElementById('sub-status');
            subRenewingField = document.getElementById('sub-renewing');
            subWebsiteField = document.getElementById('sub-website');
            subNotesField = document.getElementById('sub-notes');

            // Event listeners are now handled via delegation on the modal element

            modal.classList.add('visible');

            // Initialize floating labels and dropdowns for the new form
            initializeFloatingLabels();

            // Focus the name field
            const nameField = document.getElementById('sub-name');
            if (nameField) {
                nameField.focus();
            }

        } catch (error) {
            console.error('Failed to load form:', error);
            showToast('Failed to load form. Please try again.', 'error');
        }
    }
    
    function closeModal() {
        // Use cached modal reference instead of querying again
        modal.classList.remove('visible');
    }
    
    // populateForm function removed - forms now come pre-populated from server
    
    async function handleFormSubmit(e) {
        e.preventDefault();

        const formData = new FormData(e.target);
        const subscriptionId = formData.get('id');
        const isEdit = subscriptionId && subscriptionId.trim() !== '';

        // Prepare data object - include all fields since modal shows complete data
        const data = {
            name: formData.get('name'),
            cost: formData.get('cost') || null,
            currency: formData.get('currency') || 'NZD',
            billing_cycle: formData.get('billing_cycle') || null,
            category: formData.get('category') || null,
            status: formData.get('status') || 'active',
            auto_renewing: formData.get('renewing') === 'true',
            website_url: formData.get('website_url') || null,
            notes: formData.get('notes') || null
        };

        if (isEdit) {
            data.id = subscriptionId;
        }

        try {
            const endpoint = isEdit ? '/api/subscriptions/update' : '/api/subscriptions/create';
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                // Server now returns updated HTML fragment instead of JSON
                const updatedCardsHtml = await response.text();

                closeModal();
                showToast('Subscription saved successfully', 'success');

                // Replace the cards container with updated HTML
                const container = document.getElementById('subscription-cards');
                container.innerHTML = updatedCardsHtml;

                // Re-attach event listeners to new cards
                attachCardEventListeners();
            } else {
                showToast('Failed to save subscription. Please try again.', 'error');
            }
        } catch (error) {
            console.error('Network error:', error);
            showToast('Failed to save subscription. Please try again.', 'error');
        }
    }
    
    function showToast(message, type = 'success') {
        // Simplified client-side notification - server should handle user feedback
        console.log(`${type.toUpperCase()}: ${message}`);
    }
    
    // Global variable to store subscription ID for deletion
    let subscriptionToDelete = null;
    
    function handleDeleteClick() {
        const subscriptionId = subscriptionIdField.value;
        if (!subscriptionId) {
            showToast('No subscription selected for deletion', 'error');
            return;
        }
        
        // Get the subscription name from the form field (already populated in modal)
        const subscriptionName = subNameField.value || 'this subscription';
        
        // Store the ID and show confirmation
        subscriptionToDelete = subscriptionId;
        showDeleteConfirmation(subscriptionName);
    }
    
    function showDeleteConfirmation(subscriptionName) {
        // Use cached modal reference for delete confirmation
        
        deleteConfirmationMessage.textContent = `Are you sure you want to delete "${subscriptionName}"? This action cannot be undone.`;
        deleteConfirmationModal.classList.add('visible');
    }
    
    function closeDeleteConfirmation() {
        // Use cached modal reference instead of querying again
        deleteConfirmationModal.classList.remove('visible');
        subscriptionToDelete = null;
    }
    
    async function handleConfirmDelete() {
        if (!subscriptionToDelete) {
            showToast('No subscription selected for deletion', 'error');
            return;
        }

        try {
            const response = await fetch('/api/subscriptions/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ id: subscriptionToDelete })
            });

            if (response.ok) {
                // Server now returns updated HTML fragment instead of JSON
                const updatedCardsHtml = await response.text();

                closeDeleteConfirmation();
                closeModal();
                showToast('Subscription deleted successfully', 'success');

                // Replace the cards container with updated HTML
                const container = document.getElementById('subscription-cards');
                container.innerHTML = updatedCardsHtml;

                // Re-attach event listeners to new cards
                attachCardEventListeners();
            } else {
                showToast('Failed to delete subscription. Please try again.', 'error');
            }
        } catch (error) {
            console.error('Network error:', error);
            showToast('Failed to delete subscription. Please try again.', 'error');
        }
    }
    
    // HTML-over-the-wire fragment update functions
    async function refreshSubscriptionCards() {
        try {
            // Fetch updated cards HTML from server
            const response = await fetch('/api/fragment/subscription-cards');
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const html = await response.text();
            
            // Replace just the cards container content
            const container = document.getElementById('subscription-cards');
            container.innerHTML = html;
            
            // Re-attach clean event listeners to new cards
            attachCardEventListeners();
            
        } catch (error) {
            console.error('Failed to refresh subscription cards:', error);
            // Graceful fallback - reload if fragment fetch fails
            window.location.reload();
        }
    }
    
    function attachCardEventListeners() {
        // Event delegation handles card clicks - no need to re-attach listeners
        // This function kept for API compatibility but does nothing
    }
</script>
