<div class="manage-container">
    <!-- Add subscription button -->
    <div class="add-button-container">
        <button class="add-subscription-btn" id="add-btn">+</button>
    </div>
    
    <!-- Subscription cards -->
    <div class="cards-container" id="subscription-cards">
        {{subscription_cards}}
    </div>
</div>

<!-- Modal overlay for subscription form -->
<div class="modal-overlay" id="subscription-modal">
    <div class="modal-content">
        <div class="modal-header">
            <button class="modal-close" id="modal-close">&times;</button>
        </div>
        
        <form id="subscription-form" autocomplete="off">
            <input type="hidden" id="subscription-id" name="id">
            
            <div class="form-field">
                <label for="sub-name">name</label>
                <input type="text" id="sub-name" name="name" required autocomplete="off">
            </div>
            
            <div class="form-row">
                <div class="form-field cost-field">
                    <div class="cost-input-wrapper">
                        <input type="text" id="sub-cost" name="cost" autocomplete="off">
                        <span class="dollar-prefix">$</span>
                    </div>
                </div>
                
                <div class="form-field cycle-field">
                    <div class="custom-dropdown" data-field="billing_cycle">
                        <span class="dropdown-value">monthly</span>
                        <span class="dropdown-arrow">▼</span>
                        <div class="dropdown-menu">
                            <div class="dropdown-option" data-value="weekly">weekly</div>
                            <div class="dropdown-option selected" data-value="monthly">monthly</div>
                            <div class="dropdown-option" data-value="annually">annually</div>
                        </div>
                    </div>
                    <input type="hidden" id="sub-cycle" name="billing_cycle" value="monthly">
                </div>
                
                <div class="form-field currency-field">
                    <div class="custom-dropdown" data-field="currency">
                        <span class="dropdown-value">NZD</span>
                        <span class="dropdown-arrow">▼</span>
                        <div class="dropdown-menu">
                            <div class="dropdown-option selected" data-value="NZD">NZD</div>
                            <div class="dropdown-option" data-value="USD">USD</div>
                            <div class="dropdown-option" data-value="INR">INR</div>
                            <div class="dropdown-option" data-value="GBP">GBP</div>
                            <div class="dropdown-option" data-value="EUR">EUR</div>
                            <div class="dropdown-option" data-value="AUD">AUD</div>
                        </div>
                    </div>
                    <input type="hidden" id="sub-currency" name="currency" value="NZD">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-field category-field">
                    <div class="custom-dropdown" data-field="category">
                        <span class="dropdown-value">category</span>
                        <span class="dropdown-arrow">▼</span>
                        <div class="dropdown-menu">
                            <!-- Categories will be populated by JavaScript from database -->
                        </div>
                    </div>
                    <input type="hidden" id="sub-category" name="category" value="">
                </div>
                <!-- Space for additional category field later -->
            </div>
            
            <div class="form-row">
                <div class="form-field status-field">
                    <div class="custom-dropdown" data-field="status">
                        <span class="dropdown-value">active</span>
                        <span class="dropdown-arrow">▼</span>
                        <div class="dropdown-menu">
                            <div class="dropdown-option selected" data-value="active">active</div>
                            <div class="dropdown-option" data-value="trial">trial</div>
                            <div class="dropdown-option" data-value="paused">paused</div>
                            <div class="dropdown-option" data-value="cancelled">cancelled</div>
                        </div>
                    </div>
                    <input type="hidden" id="sub-status" name="status" value="active">
                </div>
                <!-- Space for trial checkbox later -->
            </div>
            
            <div class="form-row">
                <div class="form-field renewing-field">
                    <div class="renewing-toggle">
                        <span class="toggle-label">renewing?</span>
                        <input type="hidden" id="sub-renewing" name="renewing" value="true">
                        <span class="toggle-icons">
                            <svg class="icon-option icon-check" data-value="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <svg class="icon-option icon-x" data-value="false" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>
            
            <div class="form-field">
                <label for="sub-website">website</label>
                <input type="url" id="sub-website" name="website_url" autocomplete="off">
            </div>
            
            <div class="form-field">
                <label for="sub-notes">notes</label>
                <textarea id="sub-notes" name="notes" rows="3" autocomplete="off"></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" id="submit-btn">Add</button>
                <button type="button" id="delete-btn" class="delete-btn" style="display: none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"/>
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/>
                        <line x1="14" y1="11" x2="14" y2="17"/>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Confirmation modal for deletion -->
<div class="modal-overlay" id="delete-confirmation-modal">
    <div class="modal-content confirmation-content">
        <div class="confirmation-header">
            <h3 id="delete-confirmation-title">Delete Subscription</h3>
        </div>
        <div class="confirmation-body">
            <p id="delete-confirmation-message">Are you sure you want to delete this subscription?</p>
        </div>
        <div class="confirmation-actions">
            <button type="button" id="confirm-delete-btn" class="confirm-delete">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
                Delete
            </button>
            <button type="button" id="cancel-delete-btn">Cancel</button>
        </div>
    </div>
</div>

<script>
    // Cache DOM elements at module level to avoid repeated queries
    let modal;
    let deleteConfirmationModal;
    let form;
    let addBtn;
    let closeBtn;
    let submitBtn;
    let deleteBtn;
    let confirmDeleteBtn;
    let cancelDeleteBtn;
    let deleteConfirmationMessage;
    
    // Form field caches
    let subscriptionIdField;
    let subNameField;
    let subCostField;
    let subCurrencyField;
    let subCycleField;
    let subCategoryField;
    let subStatusField;
    let subRenewingField;
    let subWebsiteField;
    let subNotesField;
    
    // Use embedded subscription data instead of AJAX call with error handling
    let subscriptionsData;
    let categoriesData;
    try {
        subscriptionsData = {{embedded_subscriptions}};
        if (!Array.isArray(subscriptionsData)) {
            throw new Error('Invalid subscription data format');
        }
        
        categoriesData = {{embedded_categories}};
        if (!Array.isArray(categoriesData)) {
            throw new Error('Invalid categories data format');
        }
    } catch (error) {
        console.error('Failed to parse data:', error);
        subscriptionsData = [];
        categoriesData = [];
        // Show error to user if data fails to load
        setTimeout(() => {
            const container = document.getElementById('subscription-cards');
            if (container && subscriptionsData.length === 0) {
                showToast('Failed to load data. Please refresh the page.', 'error');
            }
        }, 100);
    }
    
    function initializeSubscriptionManager() {
        // Cache all DOM elements once to avoid repeated queries
        modal = document.getElementById('subscription-modal');
        deleteConfirmationModal = document.getElementById('delete-confirmation-modal');
        form = document.getElementById('subscription-form');
        addBtn = document.getElementById('add-btn');
        closeBtn = document.getElementById('modal-close');
        submitBtn = document.getElementById('submit-btn');
        deleteBtn = document.getElementById('delete-btn');
        confirmDeleteBtn = document.getElementById('confirm-delete-btn');
        cancelDeleteBtn = document.getElementById('cancel-delete-btn');
        deleteConfirmationMessage = document.getElementById('delete-confirmation-message');
        
        // Cache form field elements
        subscriptionIdField = document.getElementById('subscription-id');
        subNameField = document.getElementById('sub-name');
        subCostField = document.getElementById('sub-cost');
        subCurrencyField = document.getElementById('sub-currency');
        subCycleField = document.getElementById('sub-cycle');
        subCategoryField = document.getElementById('sub-category');
        subStatusField = document.getElementById('sub-status');
        subRenewingField = document.getElementById('sub-renewing');
        subWebsiteField = document.getElementById('sub-website');
        subNotesField = document.getElementById('sub-notes');
        
        // Data is already available - no need to fetch
        
        // Initialize dropdowns once globally with event delegation
        initializeCustomDropdowns();
        
        // Initialize renewing toggle icons
        initializeRenewingToggle();
        
        // Add subscription button click
        addBtn.addEventListener('click', () => {
            openModal('add');
        });
        
        // Card click to edit
        const cards = document.querySelectorAll('.subscription-card');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                const subscriptionId = card.dataset.subscriptionId;
                openModal('edit', subscriptionId);
            });
        });
        
        // Close modal handlers
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
        
        // Escape key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('visible')) {
                closeModal();
            }
        });
        
        // Form submission
        form.addEventListener('submit', handleFormSubmit);
        
        // Delete button click (using cached reference)
        deleteBtn.addEventListener('click', handleDeleteClick);
        
        // Delete confirmation handlers (using cached references)
        
        confirmDeleteBtn.addEventListener('click', handleConfirmDelete);
        cancelDeleteBtn.addEventListener('click', closeDeleteConfirmation);
        
        // Close confirmation modal when clicking outside
        deleteConfirmationModal.addEventListener('click', (e) => {
            if (e.target === deleteConfirmationModal) {
                closeDeleteConfirmation();
            }
        });
        
        // Escape key to close delete confirmation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && deleteConfirmationModal.classList.contains('visible')) {
                closeDeleteConfirmation();
            }
        });
    }
    
    let labelsInitialized = false;
    let dropdownsInitialized = false;
    
    function initializeFloatingLabels() {
        // Only initialize once to avoid duplicate event listeners
        if (labelsInitialized) {
            updateFloatingLabelStates();
            return;
        }
        
        const formFields = document.querySelectorAll('.form-field:not(.dropdown-field)');
        
        formFields.forEach(field => {
            const label = field.querySelector('label');
            if (!label) return;
            
            const input = field.querySelector('input[type="text"], input[type="url"], textarea');
            if (!input) return;
            
            // Handle label hiding on input (skip cost field - no label)
            if (input.id !== 'sub-cost') {
                input.addEventListener('input', () => {
                    updateLabelState(input, label);
                });
            }
            
            // No special handling needed for cost field anymore (no label)
        });
        
        labelsInitialized = true;
        updateFloatingLabelStates();
    }
    
    function buildCategoryOptions() {
        // Simple alphabetical list from database
        let options = '';
        
        if (categoriesData && categoriesData.length > 0) {
            // Simple alphabetical sort
            const sortedCategories = categoriesData
                .map(cat => cat.name)
                .sort();
            
            sortedCategories.forEach((categoryName) => {
                options += `<div class="dropdown-option" data-value="${categoryName}">${categoryName}</div>`;
            });
        }
        // No fallback - if database empty, dropdown empty (user can type custom)
        
        return { options };
    }

    function initializeCustomDropdowns() {
        // Only initialize once globally using event delegation
        if (dropdownsInitialized) return;
        dropdownsInitialized = true;
        
        // Update category dropdown with database data
        const { options } = buildCategoryOptions();
        const categoryDropdown = document.querySelector('[data-field="category"]');
        if (categoryDropdown) {
            const menu = categoryDropdown.querySelector('.dropdown-menu');
            if (menu) {
                menu.innerHTML = options;
            }
        }
        
        // Use event delegation on the modal for all dropdown events
        modal.addEventListener('click', (e) => {
            // Handle dropdown toggle
            const dropdown = e.target.closest('.custom-dropdown');
            if (dropdown && !e.target.closest('.dropdown-menu')) {
                e.stopPropagation();
                toggleDropdown(dropdown);
                return;
            }
            
            // Handle option selection
            const option = e.target.closest('.dropdown-option');
            if (option) {
                e.stopPropagation();
                const parentDropdown = option.closest('.custom-dropdown');
                selectOption(parentDropdown, option);
                return;
            }
        });
        
        // Close dropdowns when clicking outside - use setTimeout to avoid race condition
        document.addEventListener('click', (e) => {
            // Don't close if clicking inside a dropdown
            if (!e.target.closest('.custom-dropdown')) {
                setTimeout(() => closeAllDropdowns(), 0);
            }
        });
    }
    
    function toggleDropdown(dropdown) {
        // Close other dropdowns first
        const otherDropdowns = document.querySelectorAll('.custom-dropdown.open');
        otherDropdowns.forEach(other => {
            if (other !== dropdown) {
                other.classList.remove('open');
            }
        });
        
        // Toggle this dropdown
        dropdown.classList.toggle('open');
    }
    
    function selectOption(dropdown, option) {
        const value = option.dataset.value;
        const text = option.textContent;
        const field = dropdown.dataset.field;
        
        // Update display value
        const valueSpan = dropdown.querySelector('.dropdown-value');
        valueSpan.textContent = text;
        
        // Update hidden input for form submission
        let hiddenInput;
        switch (field) {
            case 'billing_cycle':
                hiddenInput = subCycleField;
                break;
            case 'currency':
                hiddenInput = subCurrencyField;
                break;
            case 'category':
                hiddenInput = subCategoryField;
                break;
            case 'status':
                hiddenInput = subStatusField;
                break;
        }
        
        if (hiddenInput) {
            hiddenInput.value = value;
        }
        
        // Update selected state
        dropdown.querySelectorAll('.dropdown-option').forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        
        // Close dropdown
        dropdown.classList.remove('open');
    }
    
    function closeAllDropdowns() {
        document.querySelectorAll('.custom-dropdown.open').forEach(dropdown => {
            dropdown.classList.remove('open');
        });
    }
    
    // Initialize renewing toggle functionality
    function initializeRenewingToggle() {
        // Use event delegation on modal for icon clicks
        modal.addEventListener('click', (e) => {
            const icon = e.target.closest('.icon-option');
            if (icon) {
                const value = icon.dataset.value;
                subRenewingField.value = value;
                updateRenewingIcons(value === 'true');
            }
        });
    }
    
    // Update visual state of renewing icons
    function updateRenewingIcons(isRenewing) {
        const checkIcon = document.querySelector('.icon-check');
        const xIcon = document.querySelector('.icon-x');
        
        if (checkIcon && xIcon) {
            if (isRenewing) {
                checkIcon.classList.add('active');
                xIcon.classList.remove('active');
            } else {
                checkIcon.classList.remove('active');
                xIcon.classList.add('active');
            }
        }
    }
    
    function updateDropdownDisplay(fieldName, value) {
        const dropdown = document.querySelector(`[data-field="${fieldName}"]`);
        if (!dropdown) return;
        
        const valueSpan = dropdown.querySelector('.dropdown-value');
        
        if (!value) {
            // Show placeholder text for empty values
            if (fieldName === 'category') {
                valueSpan.textContent = 'category';
            }
            // Clear any selected states
            dropdown.querySelectorAll('.dropdown-option').forEach(opt => opt.classList.remove('selected'));
            return;
        }
        
        const option = dropdown.querySelector(`[data-value="${value}"]`);
        
        if (option && valueSpan) {
            valueSpan.textContent = option.textContent;
            
            // Update selected state
            dropdown.querySelectorAll('.dropdown-option').forEach(opt => opt.classList.remove('selected'));
            option.classList.add('selected');
        }
    }
    
    function updateLabelState(input, label) {
        if (input.value && input.value.trim()) {
            label.classList.add('hidden');
        } else {
            label.classList.remove('hidden');
        }
    }
    
    function updateFloatingLabelStates() {
        const formFields = document.querySelectorAll('.form-field:not(.dropdown-field)');
        
        formFields.forEach(field => {
            const label = field.querySelector('label');
            const input = field.querySelector('input[type="text"], input[type="url"], textarea');
            
            if (!input || !label) return;
            
            // Skip cost field (no label anymore)
            if (input.id === 'sub-cost') {
                return;
            }
            
            updateLabelState(input, label);
        });
    }
    
    
    function openModal(mode, subscriptionId = null) {
        // Use cached DOM references instead of querying again
        
        // Reset form
        form.reset();
        subscriptionIdField.value = '';
        
        if (mode === 'add') {
            submitBtn.textContent = 'Add';
            deleteBtn.style.display = 'none'; // Hide delete button for new subscriptions
            
            // Set default values for new subscriptions only
            subCycleField.value = 'monthly';
            subCurrencyField.value = 'NZD';
            subCategoryField.value = '';
            subStatusField.value = 'active';
            subRenewingField.value = 'true'; // Default to true
            updateRenewingIcons(true); // Update visual state
            
        } else if (mode === 'edit') {
            submitBtn.textContent = 'Save';
            deleteBtn.style.display = 'flex'; // Show delete button for existing subscriptions
            
            // Populate form with existing data
            if (subscriptionId) {
                populateForm(subscriptionId);
            }
        }
        
        modal.classList.add('visible');
        
        // Initialize floating labels when modal opens
        initializeFloatingLabels();
        
        subNameField.focus();
    }
    
    function closeModal() {
        // Use cached modal reference instead of querying again
        modal.classList.remove('visible');
    }
    
    function populateForm(subscriptionId) {
        if (!subscriptionsData) {
            console.error('Subscription data not loaded');
            return;
        }
        
        // Find subscription in cached data
        const subscription = subscriptionsData.find(sub => sub.id === subscriptionId);
        if (!subscription) {
            console.error('Subscription not found:', subscriptionId);
            return;
        }
        
        // Populate all form fields with complete database data
        subscriptionIdField.value = subscriptionId;
        subNameField.value = subscription.name || '';
        
        // Clean cost field - remove $ symbol if present
        let costValue = subscription.cost || '';
        if (typeof costValue === 'string') {
            costValue = costValue.replace('$', '');
        }
        subCostField.value = costValue;
        
        // Update hidden inputs and form fields
        subCurrencyField.value = subscription.currency || '';
        subCycleField.value = subscription.billing_cycle || '';
        subCategoryField.value = subscription.category || '';
        subStatusField.value = subscription.status || '';
        const isRenewing = Boolean(subscription.auto_renewing); // Convert 0/1 to false/true
        subRenewingField.value = isRenewing ? 'true' : 'false';
        updateRenewingIcons(isRenewing);
        subWebsiteField.value = subscription.website_url || '';
        subNotesField.value = subscription.notes || '';
        
        // Update dropdown displays
        updateDropdownDisplay('currency', subscription.currency || 'NZD');
        updateDropdownDisplay('billing_cycle', subscription.billing_cycle || 'monthly');
        
        updateDropdownDisplay('category', subscription.category || '');
        
        updateDropdownDisplay('status', subscription.status || 'active');
        
        // Update floating label states after populating
        updateFloatingLabelStates();
    }
    
    async function handleFormSubmit(e) {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        const subscriptionId = formData.get('id');
        const isEdit = subscriptionId && subscriptionId.trim() !== '';
        
        // Prepare data object - include all fields since modal shows complete data
        const data = {
            name: formData.get('name'),
            cost: formData.get('cost') || null,
            currency: formData.get('currency') || 'NZD',
            billing_cycle: formData.get('billing_cycle') || null,
            category: formData.get('category') || null,
            status: formData.get('status') || 'active',
            auto_renewing: formData.get('renewing') === 'true',
            website_url: formData.get('website_url') || null,
            notes: formData.get('notes') || null
        };
        
        if (isEdit) {
            data.id = subscriptionId;
        }
        
        try {
            const endpoint = isEdit ? '/api/subscriptions/update' : '/api/subscriptions/create';
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (result.success) {
                closeModal();
                showToast('Subscription saved successfully', 'success');
                // Reload the page to show updated data
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            } else {
                showToast(result.error || 'Failed to save subscription', 'error');
            }
        } catch (error) {
            console.error('Network error:', error);
            showToast('Failed to save subscription. Please try again.', 'error');
        }
    }
    
    function showToast(message, type = 'success') {
        // Remove existing toast if any
        const existingToast = document.querySelector('.toast');
        if (existingToast) {
            existingToast.remove();
        }
        
        // Create new toast
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        
        // Show toast
        setTimeout(() => {
            toast.style.display = 'block';
        }, 10);
        
        // Hide toast after 3 seconds
        setTimeout(() => {
            toast.style.display = 'none';
            setTimeout(() => {
                toast.remove();
            }, 300);
        }, 3000);
    }
    
    // Global variable to store subscription ID for deletion
    let subscriptionToDelete = null;
    
    function handleDeleteClick() {
        const subscriptionId = subscriptionIdField.value;
        if (!subscriptionId) {
            showToast('No subscription selected for deletion', 'error');
            return;
        }
        
        // Find the subscription name for confirmation
        const subscription = subscriptionsData.find(sub => sub.id === subscriptionId);
        const subscriptionName = subscription ? subscription.name : 'this subscription';
        
        // Store the ID and show confirmation
        subscriptionToDelete = subscriptionId;
        showDeleteConfirmation(subscriptionName);
    }
    
    function showDeleteConfirmation(subscriptionName) {
        // Use cached modal reference for delete confirmation
        
        deleteConfirmationMessage.textContent = `Are you sure you want to delete "${subscriptionName}"? This action cannot be undone.`;
        deleteConfirmationModal.classList.add('visible');
    }
    
    function closeDeleteConfirmation() {
        // Use cached modal reference instead of querying again
        deleteConfirmationModal.classList.remove('visible');
        subscriptionToDelete = null;
    }
    
    async function handleConfirmDelete() {
        if (!subscriptionToDelete) {
            showToast('No subscription selected for deletion', 'error');
            return;
        }
        
        try {
            const response = await fetch('/api/subscriptions/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ id: subscriptionToDelete })
            });
            
            const result = await response.json();
            
            if (result.success) {
                closeDeleteConfirmation();
                closeModal();
                showToast('Subscription deleted successfully', 'success');
                
                // Reload the page to show updated data
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            } else {
                showToast(result.error || 'Failed to delete subscription', 'error');
            }
        } catch (error) {
            console.error('Network error:', error);
            showToast('Failed to delete subscription. Please try again.', 'error');
        }
    }
</script>
